name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install --locked dioxus-cli

      - name: Build
        run: dx bundle --release --platform desktop

      - name: Package
        shell: pwsh
        run: |
          # dx bundle の出力先を特定して ZIP に圧縮する
          $bundleDir = "target/dx/websearch-launcher/release/bundle"
          if (-not (Test-Path $bundleDir)) {
            # フォールバック: bundle ディレクトリをツリー検索
            $found = Get-ChildItem -Path target -Filter "bundle" -Directory -Recurse |
              Select-Object -First 1
            if (-not $found) { throw "bundle directory not found" }
            $bundleDir = $found.FullName
          }
          Write-Host "Bundle dir: $bundleDir"
          Get-ChildItem -Path $bundleDir -Recurse | Select-Object FullName
          Compress-Archive -Path "$bundleDir\*" -DestinationPath "websearch-launcher-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: websearch-launcher-windows-x86_64.zip
          path: websearch-launcher-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
