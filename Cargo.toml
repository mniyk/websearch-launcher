[package]
name = "websearch-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "websearch-launcher"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
rig-core = { version = "0.9", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
keyring = "3"
anyhow = "1"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
